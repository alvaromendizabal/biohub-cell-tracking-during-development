<text x="16" y="49" font-size="12">A division and a continuation</text>
<text x="35" y="82" font-size="12" fill="#647789">Frame 0</text><text x="248" y="82" font-size="12" fill="#647789">Frame 1</text>
<line x1="84" y1="166" x2="256" y2="116" stroke="#17734d" stroke-width="3"/>
