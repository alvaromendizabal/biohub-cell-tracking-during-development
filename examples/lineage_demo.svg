<circle cx="64" cy="266" r="20" fill="#eef3f7" stroke="#183041" stroke-width="2"/>
<text x="64" y="271" text-anchor="middle" font-size="16" font-weight="700">B</text>
<circle cx="276" cy="116" r="20" fill="#eef3f7" stroke="#183041" stroke-width="2"/>
<text x="276" y="121" text-anchor="middle" font-size="16" font-weight="700">C</text>
<circle cx="276" cy="216" r="20" fill="#eef3f7" stroke="#183041" stroke-width="2"/>
<text x="276" y="221" text-anchor="middle" font-size="16" font-weight="700">D</text>
<circle cx="276" cy="316" r="20" fill="#eef3f7" stroke="#183041" stroke-width="2"/>
<text x="276" y="321" text-anchor="middle" font-size="16" font-weight="700">E</text>
<text x="16" y="351" font-size="12">Exact-ID toy edge agreement: 0.50</text></g>
<g transform="translate(395,74)">
<rect width="350" height="365" rx="12" fill="#ffffff" stroke="#d8e1e8"/>
