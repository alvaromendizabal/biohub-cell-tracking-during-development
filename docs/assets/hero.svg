    <g fill="url(#cell)"><circle cx="758" cy="269" r="75"/><circle cx="970" cy="182" r="60"/><circle cx="970" cy="364" r="62"/><circle cx="1182" cy="133" r="49"/><circle cx="1182" cy="242" r="52"/><circle cx="1182" cy="386" r="61"/></g>
