    <text x="80" y="65" fill="#99B9C0" font-size="13" letter-spacing="2.7">COMPUTER VISION / GRAPH ML</text>
    <text x="56" y="160" fill="#F5F3EC" font-size="58" font-weight="700" letter-spacing="-2">Following cells.</text>
    <text x="56" y="230" fill="#F5F3EC" font-size="58" font-weight="700" letter-spacing="-2">Reconstructing</text>
    <text x="56" y="300" fill="#C7EA7A" font-size="58" font-weight="700" letter-spacing="-2">lineages.</text>
    <text x="59" y="352" fill="#BDD0D3" font-size="19">3D microscopy → temporal associations → graphs</text>
    <path d="M59 390H579" stroke="#77959F" stroke-opacity=".32"/>
    <g fill="#F5F3EC" font-size="14">
      <text x="59" y="429">CONSTRAINED OPTIMIZATION</text>
      <text x="59" y="457">ERROR ATTRIBUTION</text>
