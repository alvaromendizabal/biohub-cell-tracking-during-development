<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="600" viewBox="0 0 1320 600" role="img" aria-labelledby="title desc">
  <title id="title">Following cells. Reconstructing lineages.</title>
  <desc id="desc">An illustrative sequence of cells divides into a branching lineage. This authored diagram represents the engineering problem, not microscopy or model output.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#142B3A"/><stop offset="1" stop-color="#0B1522"/></linearGradient>
    <radialGradient id="cell"><stop stop-color="#C7EA7A" stop-opacity=".86"/><stop offset=".38" stop-color="#78CFAB" stop-opacity=".45"/><stop offset=".77" stop-color="#30B2A3" stop-opacity=".16"/><stop offset="1" stop-color="#30B2A3" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#A2C3CA" stroke-opacity=".055"/></pattern>
    <filter id="glow" x="-.8" y="-.8" width="2.6" height="2.6"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1320" height="600" rx="24" fill="url(#bg)"/>
  <rect x="618" width="702" height="600" rx="24" fill="url(#grid)"/>
  <path d="M666 0V600" stroke="#78CFAB" stroke-opacity=".15"/>
  <g font-family="Arial, Helvetica, sans-serif">
