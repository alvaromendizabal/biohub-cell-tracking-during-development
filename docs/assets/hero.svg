    </g>
    <text x="59" y="549" fill="#829DA8" font-size="13">Alvaro Mendizabal · Machine Learning Engineering</text>
    <g fill="#89A7B1" font-size="12" letter-spacing="2">
      <text x="718" y="66">OBSERVE</text><text x="925" y="66">ASSOCIATE</text><text x="1130" y="66">TRACE</text>
    </g>
