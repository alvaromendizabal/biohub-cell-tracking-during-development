name: Portfolio Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: biohub-portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio:
    name: Fresh-clone portfolio validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: "0"
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install test environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-test.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Set up JavaScript test runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Validate employer-facing portfolio
        run: python scripts/check_showcase.py
      - name: Validate repository integrity
        run: python scripts/verify_portfolio.py
      - name: Run synthetic and unit suite
        run: python scripts/run_ci.py
      - name: Self-test evidence utility
        run: python scripts/reproduce_final_evidence.py self-test
      - name: Reproduce public tracking demo twice
        run: |
          python examples/run_tracking_demo.py --output "$RUNNER_TEMP/biohub-demo-a" --seed 2026
          python examples/run_tracking_demo.py --output "$RUNNER_TEMP/biohub-demo-b" --seed 2026
          python - "$RUNNER_TEMP" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          for name in ("data.json", "data.js"):
              first = (root / "biohub-demo-a" / name).read_bytes()
              second = (root / "biohub-demo-b" / name).read_bytes()
              assert first == second, f"Non-deterministic generated {name}"
              assert first == (Path("public-demo") / name).read_bytes(), f"Stale published {name}"
              print(name, hashlib.sha256(first).hexdigest())
          print("PUBLIC_TRACKING_DEMO_REPRODUCED")
          PY
      - name: Test public lineage explorer
        run: |
          node scripts/test_live_graph.cjs
          node tests/test_public_demo_frontend.js
      - name: Package the runnable synthetic explorer
        run: cp public-demo/index.html public-demo/app.js public-demo/graph.js public-demo/styles.css "$RUNNER_TEMP/biohub-demo-a/"
      - name: Preserve generated synthetic demo for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-tracking-demo
          path: ${{ runner.temp }}/biohub-demo-a/*
          retention-days: 14
          if-no-files-found: error
