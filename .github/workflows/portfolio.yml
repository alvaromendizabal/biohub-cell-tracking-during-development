name: Portfolio Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: biohub-portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio:
    name: Fresh-clone portfolio validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m pip install --disable-pip-version-check -e .
      - name: Validate employer-facing portfolio
        run: python scripts/check_showcase.py
      - name: Validate repository integrity
        run: python scripts/verify_portfolio.py
      - name: Run synthetic and unit suite
        run: python scripts/run_ci.py
      - name: Self-test evidence utility
        run: python scripts/reproduce_final_evidence.py self-test
