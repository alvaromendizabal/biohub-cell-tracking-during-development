name: Apply final tracking project
on:
  push:
    branches: [cleanup/final-project-20261018]
    paths: [.github/workflows/zz-final-curation.yml]
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply the explicit final-component selection
        run: python .cleanup/apply.py
      - name: Install the retained hash-locked CPU environment
        run: |
          python -m pip install --require-hashes -r requirements-test.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Remove preparation input and test the resulting project
        run: |
          git rm -rf .cleanup
          python -B -S review/run.py --render
          python scripts/check_showcase.py
          python scripts/run_ci.py
          node scripts/test_live_graph.cjs
      - name: Publish source only; final workflow removal uses the connector
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep '^.github/workflows/'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Curate final lineage reconstruction; retire unused models and research workspaces'
          git push origin HEAD:cleanup/final-project-20261018
          git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/commit.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-tracking-source
          path: |
            ${{ runner.temp }}/source.zip
            ${{ runner.temp }}/commit.txt
          retention-days: 3
          if-no-files-found: error
