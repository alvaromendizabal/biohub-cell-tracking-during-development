[build-system]
requires = ["setuptools>=75,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biohub-tracking-portfolio"
version = "0.1.0"
description = "3D cell tracking and lineage graph ML: temporal modeling, graph evaluation, reproducible research, and AWS-centered engineering"
requires-python = ">=3.11,<3.14"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
