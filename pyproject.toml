[build-system]
requires = ["setuptools>=75,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biohub-tracking-portfolio"
version = "0.1.0"
description = "Evidence-led 3D cell tracking: public-reference reproduction, feature research, and graph error analysis"
requires-python = ">=3.11,<3.14"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
